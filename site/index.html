<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JJ1GUJ's AtCoder Trophy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #24292f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        align-items: center;
        background: #ffffff;
      }

      main {
        width: min(860px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 16px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
        line-height: 1.2;
      }

      .preview {
        display: grid;
        gap: 24px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 640px) {
        main {
          padding-top: 20px;
          padding-bottom: 20px;
        }

        h1 {
          margin-bottom: 20px;
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JJ1GUJ's AtCoder Trophy</h1>
      <section class="preview" aria-label="AtCoder trophy preview">
        <img
          src="atcoder/jj1guj.svg"
          alt="AtCoder trophy snapshot for jj1guj"
        />
      </section>
    </main>
  </body>
</html>
